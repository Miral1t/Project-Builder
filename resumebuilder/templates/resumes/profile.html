{% extends 'resumes/base.html' %}
{% block title %}Профіль{% endblock %}
{% block content %}
<h2>Профіль</h2>
{% if user.profile.avatar %}
    <img src="{{ user.profile.avatar.url }}" alt="Avatar" width="120" height="120">
{% else %}
    <p>Аватар не завантажено.</p>
{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ p_form.as_p }}
    <button type="submit">Оновити</button>
</form>
{% endblock %}
