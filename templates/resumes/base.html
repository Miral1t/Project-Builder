<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Resume Builder{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'resumes/static/static.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'index' %}">Головна</a>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Профіль</a>
            <a href="{% url 'logout' %}">Вихід</a>
        {% else %}
            <a href="{% url 'login' %}">Увійти</a>
            <a href="{% url 'register' %}">Реєстрація</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
