{% extends 'resumes/base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>{% if form.instance.pk %}Редагувати Навички{% else %}Додати Навички{% endif %}</h2>

  {% for skill in skills %}
    <div class="list-group mb-3">
      <div class="list-group-item">
        <h5 class="mb-1">{{ skill.name }}</h5>
        <p class="mb-1">{{ skill.level }}</p>
    </div>
  </div>
  {% endfor %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">Додати</button>
    <a href="{% url 'resume_preview' pk=resume.pk %}" class="btn btn-secondary">Завершити</a>
    <a href="{% url 'experience_add' resume_pk=resume.pk %}" class="btn btn-secondary">Назад</a>
    
  </form>
</div>
{% endblock %}
